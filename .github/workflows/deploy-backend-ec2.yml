name: Deploy backend to EC2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend-ec2.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build backend
        working-directory: backend
        run: mvn clean package -DskipTests

      - name: Verify packaged backend
        run: |
          jar tf backend/target/exam-hunt-api-0.1.0-SNAPSHOT.jar | grep -E 'BOOT-INF/lib/logback-classic-.*\.jar'

      - name: Prepare SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keygen -y -f ~/.ssh/ec2_key > /dev/null
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload JAR
        run: |
          scp -i ~/.ssh/ec2_key \
            backend/target/exam-hunt-api-0.1.0-SNAPSHOT.jar \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ec2-user/exam-hunt-api.jar.new"

      - name: Restart backend
        run: |
          ssh -i ~/.ssh/ec2_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            'sudo systemctl stop exam-hunt || true
             mv /home/ec2-user/exam-hunt-api.jar.new /home/ec2-user/exam-hunt-api.jar
             sudo systemctl start exam-hunt
             sudo systemctl status exam-hunt --no-pager'

      - name: Verify health
        run: |
          for attempt in {1..30}; do
            if curl -fsS https://api.techmuzzle.in/actuator/health; then
              exit 0
            fi
            echo "Backend not ready yet, retrying ($attempt/30)..."
            sleep 2
          done
          exit 1
