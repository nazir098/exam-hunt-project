name: Deploy backend to EC2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend-ec2.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build backend
        working-directory: backend
        run: mvn clean package

      - name: Prepare SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
        run: |
          install -m 700 -d ~/.ssh
          key_ready=false

          if [ -n "$EC2_SSH_KEY_B64" ]; then
            printf '%s' "$EC2_SSH_KEY_B64" | tr -d '[:space:]' | base64 -d > ~/.ssh/ec2_key.b64 2>/dev/null || true
            if [ -s ~/.ssh/ec2_key.b64 ] && ssh-keygen -y -f ~/.ssh/ec2_key.b64 > /dev/null 2>&1; then
              mv ~/.ssh/ec2_key.b64 ~/.ssh/ec2_key
              key_ready=true
            fi
          fi

          if [ "$key_ready" != "true" ] && [ -n "$EC2_SSH_KEY" ]; then
            printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
            if ssh-keygen -y -f ~/.ssh/ec2_key > /dev/null 2>&1; then
              key_ready=true
            fi
          fi

          if [ "$key_ready" != "true" ]; then
            echo "No valid EC2 SSH private key found. Update EC2_SSH_KEY_B64 with: base64 -i ~/Downloads/nazir.pem | pbcopy"
            exit 1
          fi

          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload JAR
        run: |
          scp -i ~/.ssh/ec2_key \
            backend/target/exam-hunt-api-0.1.0-SNAPSHOT.jar \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ec2-user/exam-hunt-api.jar"

      - name: Restart backend
        run: |
          ssh -i ~/.ssh/ec2_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            'sudo systemctl restart exam-hunt && sudo systemctl status exam-hunt --no-pager'

      - name: Verify health
        run: |
          for attempt in {1..30}; do
            if curl -fsS https://api.techmuzzle.in/actuator/health; then
              exit 0
            fi
            echo "Backend not ready yet, retrying ($attempt/30)..."
            sleep 2
          done
          exit 1
