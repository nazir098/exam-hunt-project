server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: exam-hunt-api
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://127.0.0.1:27017/exam-hunt}

app:
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  extractor-root: ${EXTRACTOR_ROOT:}
  extractor-manifest-base-url: ${EXTRACTOR_MANIFEST_BASE_URL:}
  public-files-base-url: ${PUBLIC_FILES_BASE_URL:${R2_PUBLIC_BASE_URL:}}
  import-pack-folders: ${IMPORT_PACK_FOLDERS:}
  admin-import-key: ${ADMIN_IMPORT_KEY:}
  admin-email: ${ADMIN_EMAIL:hussaininazir1@gmail.com}
  admin-bootstrap-password: ${ADMIN_PASSWORD:}
  jwt-secret: ${JWT_SECRET:exam-hunt-dev-jwt-secret-change-in-prod-32b}
  jwt-expiration-hours: ${JWT_EXPIRATION_HOURS:168}
  leaderboard-demo-seed: ${LEADERBOARD_DEMO_SEED:true}
  llm-api-key: ${OPENAI_API_KEY:}
  llm-base-url: ${OPENAI_BASE_URL:http://localhost:3001/v1}
  llm-model: ${OPENAI_CHAT_MODEL:auto}
  ai-practice-enabled: ${AI_PRACTICE_ENABLED:true}
  public-api-cache:
    max-age-seconds: ${PUBLIC_API_CACHE_MAX_AGE:60}
    s-max-age-seconds: ${PUBLIC_API_CACHE_S_MAX_AGE:300}
    stale-while-revalidate-seconds: ${PUBLIC_API_CACHE_STALE_WHILE_REVALIDATE:60}
    memory-ttl-seconds: ${PUBLIC_API_CACHE_MEMORY_TTL:120}

logging:
  level:
    com.neetlu.examhunt.service.FreeLlmClient: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
